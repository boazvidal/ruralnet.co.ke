<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Portal</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url('../images/staffbg.jpg');
    background-size: cover;
    background-position: center;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* NAVBAR */
nav {
    width: 95%;
    max-width: 1200px;
    background: black;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    border-radius: 20px;
    border-bottom: 20px solid white;
    border-top: 20px solid green;
    margin-top: 10px;
}

nav img {
    height: 70px;
}

/* CARD */
.card {
    width: 90%;
    max-width: 400px;
    background: rgba(255,255,255,0.1);
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    backdrop-filter: blur(6px);
    margin: 20px 0;
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
}

.btn {
    width: 100%;
    padding: 12px;
    background: #3498db;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

.btn:hover {
    background: #2980b9;
}

#error {
    color: red;
    margin-top: 10px;
}

footer {
    color: white;
    font-size: 13px;
}
</style>
</head>

<body>

<nav>
    <img src="../images/RURALNET.png">
</nav>

<div class="card">
    <h2>STAFF PORTAL</h2>
    <p>Sign in using your staff number</p>

    <input type="password" id="userCode" placeholder="Enter staff number">

    <div class="btn" id="loginBtn">Verify</div>

    <p id="error"></p>
</div>

<footer>
© Powered By Ruralnet ICT Academy Developer
</footer>

<!-- FIREBASE + LOGIN LOGIC -->
<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-analytics.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyAOp0bK9NtPrw2kAbe0i5UchdWXy7aQaD8",
    authDomain: "staff-portal-c1caf.firebaseapp.com",
    projectId: "staff-portal-c1caf",
    storageBucket: "staff-portal-c1caf.firebasestorage.app",
    messagingSenderId: "1091632911018",
    appId: "1:1091632911018:web:0436456763965f973cf6d3",
    measurementId: "G-0XDM45JW6L"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);


// LOGIN FUNCTION
async function verifyCode() {
    const entered = document.getElementById("userCode").value.trim();
    const errorBox = document.getElementById("error");

    if (!entered) {
        errorBox.textContent = "Enter your staff number";
        return;
    }

    try {
        const q = query(
            collection(db, "staff"),
            where("code", "==", entered)
        );

        const snapshot = await getDocs(q);

        if (!snapshot.empty) {
            window.location.href = "../resources.html";
        } else {
            errorBox.textContent = "Invalid staff number";
        }

    } catch (err) {
        console.error(err);
        errorBox.textContent = "System error. Try again later.";
    }
}

// BUTTON CLICK
document.getElementById("loginBtn").addEventListener("click", verifyCode);

// ENTER KEY SUPPORT
document.getElementById("userCode").addEventListener("keypress", function(e) {
    if (e.key === "Enter") verifyCode();
});

</script>

</body>
</html>
