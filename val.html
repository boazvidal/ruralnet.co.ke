<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Firebase Auth + Profile Demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 820px; margin: 24px auto; padding: 12px; }
    .card { border:1px solid #ddd; padding:16px; border-radius:8px; margin-bottom:12px; }
    label { display:block; margin-top:8px; }
    input[type="text"], input[type="email"], input[type="password"] { width:100%; padding:8px; box-sizing:border-box; }
    button { margin-top:8px; padding:8px 12px; }
    img.profile { width:96px; height:96px; object-fit:cover; border-radius:50%; border:1px solid #ccc; }
    .hidden { display:none; }
  </style>
</head>
<body>

  <h1>Firebase Auth + Profile (Demo)</h1>

  <!-- Auth forms -->
  <div id="auth-forms">
    <div class="card" id="signup-card">
      <h3>Create account</h3>
      <label>Email <input id="signup-email" type="email"></label>
      <label>Password <input id="signup-password" type="password"></label>
      <label>Full name <input id="signup-name" type="text"></label>
      <label>Phone <input id="signup-phone" type="text"></label>
      <button id="btn-signup">Sign up</button>
      <p><small>After sign up you will receive an email verification.</small></p>
    </div>

    <div class="card" id="login-card">
      <h3>Login</h3>
      <label>Email <input id="login-email" type="email"></label>
      <label>Password <input id="login-password" type="password"></label>
      <button id="btn-login">Log in</button>
      <button id="btn-reset" style="margin-left:8px">Forgot password?</button>
    </div>
  </div>

  <!-- Signed-in user area -->
  <div class="card hidden" id="profile-card">
    <div style="display:flex;gap:12px;align-items:center">
      <img id="profile-photo" class="profile" src="" alt="Profile photo">
      <div>
        <h3 id="profile-name">User</h3>
        <div id="profile-email"></div>
        <div id="email-verified" style="color:green;font-weight:600"></div>
      </div>
    </div>

    <hr>

    <h4>Edit profile</h4>
    <label>Full name <input id="edit-name" type="text"></label>
    <label>Phone <input id="edit-phone" type="text"></label>
    <label>Profile photo <input id="photo-file" type="file" accept="image/*"></label>
    <button id="btn-save-profile">Save profile</button>

    <h4 style="margin-top:10px">Change password</h4>
    <label>New password <input id="new-password" type="password"></label>
    <button id="btn-change-password">Change password</button>

    <div style="margin-top:12px">
      <button id="btn-logout">Logout</button>
      <button id="btn-delete" style="background:#c33;color:white;margin-left:8px">Delete account</button>
    </div>
  </div>

  <!-- Messages -->
  <div id="messages"></div>

  <!-- Firebase SDKs (modular) -->
  <script type="module">
    // ------------- Replace the config below with your Firebase project's config -------------
    const firebaseConfig = {
      apiKey: "REPLACE_API_KEY",
      authDomain: "REPLACE_PROJECT.firebaseapp.com",
      projectId: "REPLACE_PROJECT",
      storageBucket: "REPLACE_PROJECT.appspot.com",
      messagingSenderId: "REPLACE_ID",
      appId: "REPLACE_APPID"
    };
    // -----------------------------------------------------------------------------------------

    // Import the modular SDK functions from the CDN
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
             sendEmailVerification, signOut, sendPasswordResetEmail, onAuthStateChanged,
             updatePassword, deleteUser } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";
    import { getStorage, ref as sref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-storage.js";

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // UI elements
    const msg = el => document.getElementById('messages').innerText = el;
    const show = (id, yes) => document.getElementById(id).classList.toggle('hidden', !yes);

    // Signup
    document.getElementById('btn-signup').addEventListener('click', async () => {
      msg('Creating account...');
      const email = document.getElementById('signup-email').value.trim();
      const pass = document.getElementById('signup-password').value;
      const name = document.getElementById('signup-name').value.trim();
      const phone = document.getElementById('signup-phone').value.trim();

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        // Send verification email
        await sendEmailVerification(cred.user);
        // Create user doc in Firestore (users/{uid})
        await setDoc(doc(db, 'users', cred.user.uid), {
          name: name || '',
          phone: phone || '',
          createdAt: new Date().toISOString()
        });
        msg('Account created. Verification email sent. Please verify before using certain features.');
      } catch (err) {
        msg('Error: ' + err.message);
      }
    });

    // Login
    document.getElementById('btn-login').addEventListener('click', async () => {
      msg('Signing in...');
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value;
      try {
        const cred = await signInWithEmailAndPassword(auth, email, pass);
        msg('Signed in.');
      } catch (err) {
        msg('Login error: ' + err.message);
      }
    });

    // Password reset
    document.getElementById('btn-reset').addEventListener('click', async () => {
      const email = prompt('Enter your account email to receive a password reset link:');
      if (!email) return;
      try {
        await sendPasswordResetEmail(auth, email);
        alert('Password reset email sent.');
      } catch (err) {
        alert('Error: ' + err.message);
      }
    });

    // Auth state listener - updates UI
    onAuthStateChanged(auth, async user => {
      if (user) {
        show('auth-forms', false);
        show('profile-card', true);
        document.getElementById('profile-email').innerText = user.email;
        document.getElementById('email-verified').innerText = user.emailVerified ? 'Email verified' : 'Email not verified (check inbox)';
        // Load profile data from Firestore
        const docRef = doc(db, 'users', user.uid);
        const snapshot = await getDoc(docRef);
        const data = snapshot.exists() ? snapshot.data() : {};
        document.getElementById('profile-name').innerText = data.name || '(no name)';
        document.getElementById('edit-name').value = data.name || '';
        document.getElementById('edit-phone').value = data.phone || '';
        // Load profile image if exists
        const photoImg = document.getElementById('profile-photo');
        try {
          const url = await getDownloadURL(sref(storage, `profile_images/${user.uid}/avatar`));
          photoImg.src = url;
        } catch (e) {
          photoImg.src = 'https://via.placeholder.com/96?text=No+Photo';
        }
      } else {
        show('auth-forms', true);
        show('profile-card', false);
        document.getElementById('profile-photo').src = '';
      }
    });

    // Save profile (Firestore + optional storage upload)
    document.getElementById('btn-save-profile').addEventListener('click', async () => {
      const user = auth.currentUser;
      if (!user) { msg('Not authenticated'); return; }
      msg('Saving profile...');
      const name = document.getElementById('edit-name').value.trim();
      const phone = document.getElementById('edit-phone').value.trim();
      const fileInput = document.getElementById('photo-file');
      const docRef = doc(db, 'users', user.uid);

      try {
        // Update Firestore
        await updateDoc(docRef, { name, phone });
        // If a file is chosen, upload it
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const storageRef = sref(storage, `profile_images/${user.uid}/avatar`);
          await uploadBytes(storageRef, file);
        }
        msg('Profile saved.');
      } catch (err) {
        msg('Save error: ' + err.message);
      }
    });

    // Change password
    document.getElementById('btn-change-password').addEventListener('click', async () => {
      const user = auth.currentUser;
      if (!user) { msg('Not signed in'); return; }
      const newPass = document.getElementById('new-password').value;
      if (!newPass || newPass.length < 6) { alert('Password should be at least 6 characters'); return; }
      try {
        await updatePassword(user, newPass);
        alert('Password changed.');
      } catch (err) {
        alert('Error changing password: ' + err.message + '\nYou may need to re-login before changing password.');
      }
    });

    // Logout
    document.getElementById('btn-logout').addEventListener('click', async () => {
      await signOut(auth);
      msg('Signed out.');
    });

    // Delete account (also delete Firestore doc + storage)
    document.getElementById('btn-delete').addEventListener('click', async () => {
      if (!confirm('Are you sure you want to permanently delete your account?')) return;
      const user = auth.currentUser;
      if (!user) return;
      try {
        // Delete Firestore doc
        await setDoc(doc(db, 'users', user.uid), {}); // optionally delete fields; you can call deleteDoc instead
        // Delete storage avatar
        try { await deleteObject(sref(storage, `profile_images/${user.uid}/avatar`)); } catch(e) { /* ignore missing file */ }
        // Delete auth user
        await deleteUser(user);
        msg('Account deleted.');
      } catch (err) {
        msg('Delete error: ' + err.message + '. You may need to re-authenticate (log in again) before deletion.');
      }
    });

  </script>
</body>
</html>
