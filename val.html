<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: #fff;
            margin: 40px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .profile-pic {
            text-align: center;
        }

        .profile-pic img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ddd;
        }

        input[type="file"] {
            display: none;
        }

        .upload-btn {
            margin-top: 10px;
            display: inline-block;
            padding: 8px 15px;
            background: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .input-group {
            margin-top: 20px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-top: 5px;
            font-size: 15px;
        }

        .save-btn {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #28a745;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #218838;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="profile-pic">
            <img id="previewImg" src="https://via.placeholder.com/130" alt="Profile Picture">
            <br>
            <label for="imgUpload" class="upload-btn">Upload Image</label>
            <input type="file" id="imgUpload" accept="image/*" onchange="previewImage(event)">
        </div>

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>

        <div class="input-group">
            <label>Phone Number</label>
            <input type="text" id="phone" placeholder="Enter phone number">
        </div>

        <button class="save-btn" onclick="saveDetails()">Save Changes</button>
    </div>

    <script>
        // Load saved data on page load
        window.onload = function() {
            if (localStorage.getItem("name")) {
                document.getElementById("name").value = localStorage.getItem("name");
            }

            if (localStorage.getItem("email")) {
                document.getElementById("email").value = localStorage.getItem("email");
            }

            if (localStorage.getItem("phone")) {
                document.getElementById("phone").value = localStorage.getItem("phone");
            }

            if (localStorage.getItem("profileImage")) {
                document.getElementById("previewImg").src = localStorage.getItem("profileImage");
            }
        }

        // Preview + Save Image
        function previewImage(event) {
            const file = event.target.files[0];
            const reader = new FileReader();

            reader.onload = function() {
                document.getElementById("previewImg").src = reader.result;
                localStorage.setItem("profileImage", reader.result); // Save permanently
            }

            if (file) {
                reader.readAsDataURL(file);
            }
        }

        // Save text info permanently
        function saveDetails() {
            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let phone = document.getElementById("phone").value.trim();

            if (!name || !email || !phone) {
                alert("Please fill all fields!");
                return;
            }

            // Save to localStorage
            localStorage.setItem("name", name);
            localStorage.setItem("email", email);
            localStorage.setItem("phone", phone);

            alert("Details saved permanently!");
        }
    </script>

</body>
</html>
