  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background-image: url(images/bkl.jpg);
      background-repeat: no-repeat;
      background-size: cover;
      font-family: 'Courier New', Courier, monospace;
    }

    nav {
      background: black;
      border-bottom: 10px solid white;
      width: 100%;
    }

    nav a {
      color: white;
      font-family: Georgia, 'Times New Roman', Times, serif;
      size: 14px;
      text-decoration: none;
    }

    nav img {
      width: 100px;
      height: auto;
    }

    .book {
      width: 800px;   /* Wider */
      height: 500px;  /* Taller */
      perspective: 2000px;
      position: relative;
    }

    .page {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: left;
      transform-style: preserve-3d;
      transition: transform 1s ease;
      border-radius: 10px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .front, .back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 10px;
      box-sizing: border-box;
    }

    .front img, .back img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 10px;
    }

    .back {
      transform: rotateY(180deg);
    }

    .page.flipped {
      transform: rotateY(-180deg);
      z-index: 0 !important;
    }

    /* Stack order */
    .page:nth-child(1) {z-index: 12;}
    .page:nth-child(2) {z-index: 11;}
    .page:nth-child(3) {z-index: 10;}
    .page:nth-child(4) {z-index: 9;}
    .page:nth-child(5) {z-index: 8;}
    .page:nth-child(6) {z-index: 7;}
    .page:nth-child(7) {z-index: 6;}
    .page:nth-child(8) {z-index: 5;}
    .page:nth-child(9) {z-index: 4;}
    .page:nth-child(10) {z-index: 3;}
    .page:nth-child(11) {z-index: 2;}
    .page:nth-child(12) {z-index: 1;}

    button {
      padding: 12px 25px;
      margin-top: 25px;
      border: none;
      border-radius: 8px;
      background: #da3232;
      color: white;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      transition: background 0.3s;
    }

    button:hover {
      background: #444;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      background-color: black;
      color: white;
      padding: 40px 60px;
      flex-wrap: wrap;
      text-decoration: none;
      width: 100%;
    }

    .footer a, .footer p, .footer li {
      color: white;
      text-decoration: none;
      margin-bottom: 3px;
      padding-left: 7px;
    }

    .footer-column {
      flex: 1;
      min-width: 200px;
      margin: 0 20px;
      border-bottom: 5px solid white;
      border-radius: 10px;
      background-color: #1d1c1c;


    }

    .footer h3 {
      font-size: 16px;
      margin-top: 15px;
      text-transform: uppercase;
      border-bottom: 2px solid yellow;
      padding-bottom: 5px;
    
    }
    
  </style>
</head>

<!--F12-->
<script>
	document.onkeydown = function(e) {

	//F12
	if (e.keyCode == 123) {
		return false;
	}


//Ctrl+Shift+I or Ctrl+Shift+J or Ctrl+Shift+C

	if (e.ctrlKey && e.shiftKey && (
		e.keyCode === 73 ||
		e.keyCode === 74 ||
		e.keyCode === 67
	)) {
		return false;
	}

//Ctrl+U View Source-->

	if (e.ctrlKey && e.keyCode === 85) {
		return false;
	}

	//Ctrl+C Copy
	if (e.ctrlKey && e.keyCode === 67) {
		return false;
	}
};
</script>

  <button onclick="flipPage()">⏭</button>

  <script>
    let currentPage = 0;
    const pages = document.querySelectorAll('.page');

    function flipPage() {
      if (currentPage < pages.length) {
        pages[currentPage].classList.add('flipped');
        currentPage++;
      } else {
        // Reset the book
        pages.forEach(p => p.classList.remove('flipped'));
        currentPage = 0;
      }
    }
  </script>
