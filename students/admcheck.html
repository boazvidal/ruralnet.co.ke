<!DOCTYPE html>
<html>
<head>
<title>Admission Check</title>

<style>
body{
  font-family: Arial;
  background:#f4f4f4;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:white;
  padding:30px;
  border-radius:10px;
  width:350px;
  text-align:center;
}
input,button{
  width:100%;
  padding:10px;
  margin:10px 0;
}
button{
  background:#007bff;
  color:white;
  border:none;
}
</style>
</head>

<body>

<div class="box">
<h2>Enter Admission Number</h2>
<input id="adm" placeholder="Admission Number">
<button onclick="checkAdmission()">Proceed</button>
<p id="msg"></p>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
apiKey: "AIzaSyCb269VbClV7GFGMeQPcExLf51F2vkeRdU",
authDomain: "student-dashboard-a4d8a.firebaseapp.com",
projectId: "student-dashboard-a4d8a",
storageBucket: "student-dashboard-a4d8a.firebasestorage.app",
messagingSenderId: "445918817492",
appId: "1:445918817492:web:b5bad1559f5e18880d5f41"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// CHECK ADMISSION
function checkAdmission(){
let adm = document.getElementById("adm").value;

db.collection("Admission-numbers").doc(adm).get()
.then(doc=>{
  if(doc.exists){
    localStorage.setItem("Admission-numbers",adm);
    window.location="signup.html";
  }else{
    document.getElementById("msg").innerText="Admission not found";
  }
});
}
</script>

</body>
</html>
