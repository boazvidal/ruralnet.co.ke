<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Portal - Admission Check</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
      text-align: center;
    }

    input {
      display: block;
      margin: 10px auto;
      padding: 10px;
      width: 90%;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      background: #007BFF;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background: #0056b3;
    }

    .error {
      color: red;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Enter Admission Number</h2>
    <form id="admissionForm">
      <input type="text" id="admissionNumber" placeholder="Admission Number" required>
      <button type="submit">Proceed</button>
    </form>
    <p id="errorMessage" class="error"></p>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>

  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCb269VbClV7GFGMeQPcExLf51F2vkeRdU",
      authDomain: "student-dashboard-a4d8a.firebaseapp.com",
      projectId: "student-dashboard-a4d8a",
      storageBucket: "student-dashboard-a4d8a.firebasestorage.app",
      messagingSenderId: "445918817492",
      appId: "1:445918817492:web:b5bad1559f5e18880d5f41"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Handle admission form submission
    document.getElementById("admissionForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const admissionNumber = document.getElementById("admissionNumber").value.trim();

      try {
        // Check if admission number exists in Firestore
        const studentDoc = await db.collection("students").doc(admissionNumber).get();

        if (studentDoc.exists) {
          document.getElementById("errorMessage").innerText = "Admission number not found!";
        } else {
          // Redirect to signup page with admission number in URL
          window.location.href = `signup.html?adm=${admissionNumber}`;
        }
      } catch (error) {
        document.getElementById("errorMessage").innerText = "Error: " + error.message;
      }
    });
  </script>
</body>
</html>
