<!DOCTYPE html>

<style>
    body {

        justify-content: center;

    .container {

        width: 300px;

    }

        color: green;
        font-family: 'Bernard MT Condensed';
        text-shadow:
            -1px -1px 0 WHITE,
            1px 1px 0 white;
    }

    .container a {
        color: white;
        background-color: none;
        border-radius: 15px;
        border-bottom: 3px solid white;
        border-top: 1px solid blue;
        margin-top: 0.5rem;
        padding: 1rem;
        margin: 1rem;
        margin-right: 1rem;
        text-decoration: none;
        font-weight: bold;
        font-family: Arial, Helvetica, sans-serif;
    }

    .container a:hover {
        color: red;
        background-color: white;
        cursor: url("../images/hover.svg") 16 16, pointer;
    }

    input {
        width: 90%;
        padding: 10px;
        margin-top: 10px;
        border: 1px solid #aaa;
        border-radius: 6px;
        font-size: 16px;
    }

    button {
        margin-top: 15px;
        width: 95%;
        padding: 10px;
        background: darkblue;
        color: white;
        border: none;
        font-size: 16px;
        border-radius: 15px;
        cursor: pointer;
        margin-bottom: 2rem;
        border: 2px solid white;
    }

    button:hover {
        background: #0056b3;
    }

    .error {
        margin-top: 12px;
        color: maroon;
        font-size: 14px;
        height: 18px;
    }
</style>

</head>

    <!--FULL PAGE PROTECTION SCRIPT -->

<script>
	//Right-Click
	document.addEventListener('contextmenu', event => event.preventDefault());
</script>

<!--F12-->
<script>
	document.onkeydown = function(e) {

	//F12
	if (e.keyCode == 123) {
		return false;
	}


//Ctrl+Shift+I or Ctrl+Shift+J or Ctrl+Shift+C

	if (e.ctrlKey && e.shiftKey && (
		e.keyCode === 73 ||
		e.keyCode === 74 ||
		e.keyCode === 67
	)) {
		return false;
	}

//Ctrl+U View Source-->

	if (e.ctrlKey && e.keyCode === 85) {
		return false;
	}

	//Ctrl+C Copy
	if (e.ctrlKey && e.keyCode === 67) {
		return false;
	}
};
</script>

    <script>
