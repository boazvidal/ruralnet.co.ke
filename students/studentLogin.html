<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudentPortal</title>
<link rel="icon" type="image/png" href="../images/favicon.png">
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: url('../images/bbk.jpg');
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        background: rgb(255, 255, 255, 0.1);
        backdrop-filter: blur(3px);
        box-shadow: 0 8px 20px rgb(0, 0, 0, 0.2);
        padding: 25px;
        width: 320px;
        border-radius: 10px;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
        text-align: center;
    }

    .container img {
        width: 300px;
        height: auto;
    }

    .container h1 {
        color: green;
        font-family: 'Bernard MT Condensed';
        text-shadow: 
        -px -px rgba(0, 0, 0);
    }

    input {
        width: 90%;
        padding: 10px;
        margin-top: 10px;
        border: 1px solid #aaa;
        border-radius: 6px;
        font-size: 16px;
    }

    button {
        margin-top: 15px;
        width: 95%;
        padding: 10px;
        background: #007bff;
        color: white;
        border: none;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
    }

    button:hover {
        background: #0056b3;
    }

    .error {
        margin-top: 12px;
        color: maroon;
        font-size: 14px;
        height: 18px;
    }
</style>

</head>
<body>

    <!--FULL PAGE PROTECTION SCRIPT -->

<script>
	//Right-Click
	document.addEventListener('contextmenu', event => event.preventDefault());
</script>

<!--F12-->
<script>
	document.onkeydown = function(e) {

	//F12
	if (e.keyCode == 123) {
		return false;
	}


//Ctrl+Shift+I or Ctrl+Shift+J or Ctrl+Shift+C

	if (e.ctrlKey && e.shiftKey && (
		e.keyCode === 73 ||
		e.keyCode === 74 ||
		e.keyCode === 67
	)) {
		return false;
	}

//Ctrl+U View Source-->

	if (e.ctrlKey && e.keyCode === 85) {
		return false;
	}

	//Ctrl+C Copy
	if (e.ctrlKey && e.keyCode === 67) {
		return false;
	}
};
</script>


<div class="container">
    <img src="../images/RURALNET.png">
    <h1>STUDENT LOGIN PAGE</h1>
    <h2>SIGN IN TO PROCEED</h2>
    <p>Enter Your name followed by your Admission Number</p>
    <p>eg; BRIAN-RICT/001/001</p>
    <input type="text" id="levelInput" placeholder="BRIAN-RICT/00001/0003">
    <button onclick="checkLevel()">Proceed</button>

    <div class="error" id="error"></div>
</div>

<script>
function checkLevel() {
    // Convert user input to UPPERCASE
    let level = document.getElementById("levelInput").value.trim().toUpperCase();
    let error = document.getElementById("error");

    // CLEAR ERROR
    error.textContent = "";

    // LEVEL CHECKS (UPPERCASE ONLY)
    if (level === "SUSAN-RICT/001") {
        window.location.href = "Susan.html";
    }
    else if (level === "USER") {
        window.location.href = "downloads.html";
    }
    else if (level === "LEVEL3") {
        window.location.href = "vp3.html";
    }
    else {
        error.textContent = "❌ Invalid Admission Number! Try again.";
    }
}
</script>


</body>
</html>
