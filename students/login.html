<!DOCTYPE html>
<html>
<head>
<title>Student Login</title>

<!-- Font Awesome icons -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  backdrop-filter:blur(20px);
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.2);
  width:400px;
  padding:30px;
  border-radius:20px;
  color:white;
}

h2{text-align:center;margin-bottom:20px;}

.input-group{
  position:relative;
}

.input-group i{
  position:absolute;
  left:12px;
  top:14px;
  color:#ddd;
}

input{
  width:100%;
  padding:12px 12px 12px 38px;
  margin:10px 0;
  border-radius:8px;
  border:none;
  outline:none;
  background:rgba(255,255,255,0.15);
  color:white;
}

input::placeholder{color:#ccc;}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:linear-gradient(90deg,#00c6ff,#0072ff);
  color:white;
  cursor:pointer;
  font-size:16px;
}

button:hover{
  transform:scale(1.03);
}

.links{
  display:flex;
  justify-content:space-between;
  margin-top:12px;
  font-size:14px;
}

.links a{
  color:#00c6ff;
  cursor:pointer;
  text-decoration:none;
}

#msg{
  text-align:center;
  margin-top:15px;
  color:yellow;
}

.show{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="box">

<h2>Student Login</h2>

<!-- Admission -->
<div class="input-group">
<i class="fa fa-id-card"></i>
<input id="adm" placeholder="Admission Number">
</div>

<!-- Password -->
<div class="input-group">
<i class="fa fa-lock"></i>
<input id="password" type="password" placeholder="Password">
</div>

<div class="show">
<input type="checkbox" onclick="showPassword()"> Show Password
</div>

<button onclick="login()">Proceed</button>

<div class="links">
<a onclick="gotoSignup()">Signup</a>
<a onclick="forgot()">Forgot Password?</a>
</div>

<p id="msg"></p>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
const firebaseConfig = {
apiKey: "AIzaSyCb269VbClV7GFGMeQPcExLf51F2vkeRdU",
authDomain: "student-dashboard-a4d8a.firebaseapp.com",
projectId: "student-dashboard-a4d8a",
storageBucket: "student-dashboard-a4d8a.firebasestorage.app",
messagingSenderId: "445918817492",
appId: "1:445918817492:web:b5bad1559f5e18880d5f41"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();


// 🔹 Show password
function showPassword(){
  let p = document.getElementById("password");
  p.type = (p.type === "password") ? "text" : "password";
}


// 🔹 Login
function login(){

  let adm = document.getElementById("adm").value.trim();
  let password = document.getElementById("password").value;

  if(!adm || !password){
    document.getElementById("msg").innerText =
    "Enter admission and password.";
    return;
  }

  let email = adm + "@ruralnet.com";

  auth.signInWithEmailAndPassword(email,password)
  .then(()=>{

    // save login session
    localStorage.setItem("student", adm);

    document.getElementById("msg").innerText =
    "Login successful...";

    setTimeout(()=>{
      window.location = "dashboard.html";
    },1200);

  })
  .catch(error => {

    console.log(error); // debug in console

    if(error.code === "auth/user-not-found"){
      document.getElementById("msg").innerText =
      "Admission not registered.";
    }

    else if(error.code === "auth/wrong-password"){
      document.getElementById("msg").innerText =
      "Incorrect password.";
    }

    else if(error.code === "auth/invalid-login-credentials"){
      document.getElementById("msg").innerText =
      "Invalid admission or password.";
    }

    else{
      document.getElementById("msg").innerText =
      "Login failed. Try again.";
    }

  });
}


// 🔹 Signup
function gotoSignup(){
  window.location = "check.html";
}


// 🔹 Forgot password
function forgot(){

  let adm = document.getElementById("adm").value.trim();

  if(!adm){
    document.getElementById("msg").innerText =
    "Enter admission first.";
    return;
  }

  let email = adm + "@ruralnet.com";

  auth.sendPasswordResetEmail(email)
  .then(()=>{
    document.getElementById("msg").innerText =
    "Password reset email sent.";
  })
  .catch(()=>{
    document.getElementById("msg").innerText =
    "Admission not found.";
  });
}

</script>

</body>
</html>
