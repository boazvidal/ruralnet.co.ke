<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- SIMPLE PAGE STYLING -->
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        margin: 0;
        padding: 0;
    }

    .container {
        max-width: 900px;
        margin: auto;
        background: white;
        padding: 25px;
        margin-top: 40px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
        border-left: 5px solid #007bff;
        padding-left: 10px;
    }

    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
    }

    input {
        padding: 10px;
        width: 100%;
        margin-top: 5px;
        border-radius: 5px;
        border: 1px solid #bbb;
    }

    button {
        background: #007bff;
        color: white;
        padding: 12px 25px;
        border: none;
        border-radius: 5px;
        margin-top: 20px;
        cursor: pointer;
    }

    button:hover {
        background: #0056b3;
    }

    #profile-pic {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #007bff;
        display: block;
        margin-bottom: 10px;
    }

    #not-logged-in {
        text-align: center;
        margin-top: 100px;
        font-size: 20px;
        color: red;
    }
</style>
</head>

<body>

<!-- USER DASHBOARD -->
<div class="container" id="dashboard" style="display:none;">

    <h2>User Dashboard</h2>

    <!-- PROFILE PHOTO -->
    <img id="profile-pic" src="https://via.placeholder.com/120">
    <input type="file" id="profileImageInput" accept="image/*">

    <h3>Personal Information</h3>

    <label>Name</label>
    <input id="name">

    <label>Email Address</label>
    <input id="email" disabled>

    <label>Phone Number</label>
    <input id="phoneNumber">

    <label>Parent Contact</label>
    <input id="parentContact">

    <label>Date of Birth</label>
    <input type="date" id="dob">


    <h3>Location Details</h3>

    <label>Country</label>
    <input id="country">

    <label>County</label>
    <input id="county">

    <label>Location</label>
    <input id="location">

    <label>Sub Location</label>
    <input id="subLocation">

    <label>Constituency</label>
    <input id="constituency">

    <label>Ward</label>
    <input id="ward">

    <label>Nearest Town</label>
    <input id="nearestTown">

    <label>P.O. Box</label>
    <input id="poBox">


    <h3>Academic Details</h3>

    <label>Date of Enrollment</label>
    <input type="date" id="enrollmentDate">

    <label>Course</label>
    <input id="course">

    <label>Duration</label>
    <input id="duration">

    <label>Date of Completion</label>
    <input type="date" id="completionDate">


    <button onclick="saveProfile()">Save Changes</button>
</div>

<!-- MESSAGE IF USER IS NOT LOGGED IN -->
<div id="not-logged-in" style="display:none;">
    You are not logged in. Please log in first.
</div>

<!-- FIREBASE SCRIPTS -->
<script type="module">

/* ---------------------------------------------
   1. IMPORT FIREBASE SDK MODULES
   --------------------------------------------- */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { 
    getAuth, onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import { 
    getFirestore, doc, getDoc, updateDoc, setDoc 
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

import { 
    getStorage, ref, uploadBytes, getDownloadURL 
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";


/* ---------------------------------------------
   2. INSERT YOUR FIREBASE CONFIG HERE
   --------------------------------------------- */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_BUCKET",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};


/* ---------------------------------------------
   3. INITIALIZE FIREBASE SERVICES
   --------------------------------------------- */
const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();
const storage = getStorage();


/* ---------------------------------------------
   4. WHEN USER IS LOGGED IN → SHOW DASHBOARD
   --------------------------------------------- */
onAuthStateChanged(auth, async (user) => {
    if (user) {
        document.getElementById("dashboard").style.display = "block";
        loadUserProfile(user.uid);
    } else {
        document.getElementById("not-logged-in").style.display = "block";
    }
});


/* ---------------------------------------------
   5. LOAD USER PROFILE DATA
   --------------------------------------------- */
async function loadUserProfile(uid) {
    const ref = doc(db, "users", uid);
    const snapshot = await getDoc(ref);

    if (!snapshot.exists()) {
        await setDoc(ref, {}); // Create empty user document
    }

    const data = snapshot.data() || {};

    // Fill in form fields
    document.getElementById("name").value = data.name || "";
    document.getElementById("email").value = auth.currentUser.email;

    document.getElementById("phoneNumber").value = data.phoneNumber || "";
    document.getElementById("parentContact").value = data.parentContact || "";
    document.getElementById("dob").value = data.dateOfBirth || "";

    document.getElementById("country").value = data.country || "";
    document.getElementById("county").value = data.county || "";
    document.getElementById("location").value = data.location || "";
    document.getElementById("subLocation").value = data.subLocation || "";
    document.getElementById("constituency").value = data.constituency || "";
    document.getElementById("ward").value = data.ward || "";
    document.getElementById("nearestTown").value = data.nearestTown || "";
    document.getElementById("poBox").value = data.poBox || "";

    if (data.profileImageUrl)
        document.getElementById("profile-pic").src = data.profileImageUrl;

    if (data.academicDetails) {
        document.getElementById("enrollmentDate").value = data.academicDetails.dateOfEnrollment || "";
        document.getElementById("course").value = data.academicDetails.course || "";
        document.getElementById("duration").value = data.academicDetails.duration || "";
        document.getElementById("completionDate").value = data.academicDetails.dateOfCompletion || "";
    }
}


/* ---------------------------------------------
   6. UPLOAD PROFILE IMAGE
   --------------------------------------------- */
document.getElementById("profileImageInput").addEventListener("change", async function(event) {
    const file = event.target.files[0];
    const user = auth.currentUser;

    if (!file || !user) return;

    const storageRef = ref(storage, "profileImages/" + user.uid + ".jpg");

    await uploadBytes(storageRef, file);

    const downloadURL = await getDownloadURL(storageRef);

    await updateDoc(doc(db, "users", user.uid), {
        profileImageUrl: downloadURL
    });

    document.getElementById("profile-pic").src = downloadURL;
});


/* ---------------------------------------------
   7. SAVE PROFILE CHANGES
   --------------------------------------------- */
window.saveProfile = async function () {
    const user = auth.currentUser;
    if (!user) return alert("Not logged in!");

    const uid = user.uid;

    const profileData = {
        name: document.getElementById("name").value,
        phoneNumber: document.getElementById("phoneNumber").value,
        parentContact: document.getElementById("parentContact").value,
        dateOfBirth: document.getElementById("dob").value,

        country: document.getElementById("country").value,
        county: document.getElementById("county").value,
        location: document.getElementById("location").value,
        subLocation: document.getElementById("subLocation").value,
        constituency: document.getElementById("constituency").value,
        ward: document.getElementById("ward").value,
        nearestTown: document.getElementById("nearestTown").value,
        poBox: document.getElementById("poBox").value,

        academicDetails: {
            dateOfEnrollment: document.getElementById("enrollmentDate").value,
            course: document.getElementById("course").value,
            duration: document.getElementById("duration").value,
            dateOfCompletion: document.getElementById("completionDate").value,
        }
    };

    await updateDoc(doc(db, "users", uid), profileData);

    alert("Profile updated successfully!");
};

</script>

</body>
</html>
