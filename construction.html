<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pyscript$ver</title>
<style>

  body {
    background-image: url(images/green.jpg);
    background-size: cover;
    background-repeat: no-repeat;
  }

  nav {
    background-color: linear-gradient(to righ, green, white);
  }

  nav a {
    color: white;
    font-family: 'Geneva';
    font-size: 30px;
    font-weight: bold;
    background-color: black;
    border-bottom: solid white;
    border-radius: 8px;
    padding: 2rem;
    text-decoration: none;
  }

  .construction {
    align-items: center;
    justify-content: center;
  }

  .construction img {
      width: 400px;
      height: auto;

  }

  .construction h1, h2 {
    size: 100px;
    color: white;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    display: float;
    margin: 20, 0;

  }


  /* Overlay background */
  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(75, 63, 240, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    animation: fadeIn 0.4s ease;
  }

  /* Floating box */
  .floating-box {
    color: white;
    font-family: 'georgia';
    background: rgb(0, 0, 0);
    width: 300px;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 2.1);
    position: relative;
    animation: popIn 0.4s ease;
    border-bottom: 10px solid white;
  }

  .floating-box img {
    width: 100px;
    height: auto;
  }

  /* Close (X) button */
  .close-btn {
    position: absolute;
    top: -32px;
    right: -22px;
    font-size: 40px;
    font-family: 'arial black';
    color: #da1616;
    cursor: pointer;
    font-weight: bold;
  }

  .close-btn:hover {
    color: rgb(30, 128, 0);
  }

  /* Entrance animations */
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes popIn {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  /* Exit animations */
  @keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
  }

  @keyframes popOut {
    from { transform: scale(1); opacity: 1; }
    to { transform: scale(0.9); opacity: 0; }
  }

  /* Classes triggered when closing */
  .closing {
    animation: fadeOut 0.4s ease forwards;
  }

  .closing .floating-box {
    animation: popOut 0.4s ease forwards;
  }

  footer {
    background-color: black;
  }
</style>
</head>
<body>

  <nav>
    <a href="index.html">Back to Home</a>
  </nav>

<div class="construction">
  <img src="images/uc.png">
  <h2>Keep checking after 24 hours</h2>
</div>

<!-- Floating Box Section -->
<div class="overlay" id="overlay">
  <div class="floating-box">
    <span class="close-btn" onclick="closeBox()">×</span>
    <img src="images/woi.png">  <img src="images/thinking.jpg">
    <h2>OPS!</h2>
    <h3>Working on this site</h3>
  </div>
</div>

<script>
  function closeBox() {
    const overlay = document.getElementById("overlay");
    overlay.classList.add("closing");

    // Wait for animation to finish (400ms), then hide the overlay
    setTimeout(() => {
      overlay.style.display = "none";
    }, 400);
  }
</script>

</body>

<footer>
  <h2></h2>
  <h2></h2>
</footer>
</html>
