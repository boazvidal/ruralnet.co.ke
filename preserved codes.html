<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Flipbook</title>

  <style>
    /* 🌈 General background & layout */
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #3bad06, #f9fbe7, #e7cda3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* 📖 Flipbook wrapper */
    #flipbook-section {
      perspective: 2000px;
      width: 400px;
      height: 500px;
      position: relative;
      margin-bottom: 30px;
    }

    .book {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }

    /* 📄 Each page */
    .page {
      width: 100%;
      height: 100%;
      position: absolute;
      transform-origin: left;
      transition: transform 1s ease, box-shadow 0.5s ease;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    /* 🖼️ Image styling */
    .page img {
      width: 100%;
      height: auto;
      object-fit: cover;
      display: block;
      object-fit: cover;
    }

    /* 🔄 Flip animation */
    .page.flipped {
      transform: rotateY(-180deg);
      box-shadow: -5px 5px 15px rgba(0,0,0,0.2);
    }

    /* Front and back sides */
    .front, .back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
    }
    .back {
      transform: rotateY(180deg);
    }

    /* ✨ Optional border for realism */
    .page::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 10px;
      pointer-events: none;
    }

    /* 🧭 Control Buttons */
    .controls {
      display: flex;
      gap: 20px;
    }

    .btn {
      background: #00796b;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: 0.3s;
    }

    .btn:hover {
      background: #004d40;
      transform: scale(1.05);
    }

    /* 📱 Responsive */
    @media (max-width: 600px) {
      #flipbook-section {
        width: 90%;
        height: 350px;
      }
      .btn {
        padding: 8px 16px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <!--📖 Flipbook Section -->
  <section id="flipbook-section">
    <div class="book" id="book">
      <!-- Example pages -->
      <div class="page">
        <div class="front">
          <img src="images/c101.jpg" alt="Photo 101" />
        </div>
        <div class="back">
          <img src="images/c0.jpg" alt="Photo Back" />
        </div>
      </div>

      <div class="page">
        <div class="front">
          <img src="images/c1.jpg" alt="Photo 1" />
        </div>
        <div class="back">
          <img src="images/c2.jpg" alt="Photo 2" />
        </div>
      </div>

      <div class="page">
        <div class="front">
          <img src="images/c3.jpg" alt="Photo 3" />
        </div>
        <div class="back">
          <img src="images/c4.jpg" alt="Photo 4" />
        </div>
      </div>

      <!-- Add more pages as needed -->
    </div>
  </section>

  <!-- 🧭 Flip Controls -->
  <div class="controls">
    <button class="btn" id="prevPage">⬅ Previous</button>
    <button class="btn" id="nextPage">Next ➡</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const pages = Array.from(document.querySelectorAll('.page'));
      const nextBtn = document.getElementById('nextPage');
      const prevBtn = document.getElementById('prevPage');

      let currentPage = 0;

      // Initial stacking order (top = first page)
      pages.forEach((p, i) => p.style.zIndex = pages.length - i);

      // ➡ Flip next page
      nextBtn.addEventListener('click', () => {
        if (currentPage < pages.length) {
          pages[currentPage].classList.add('flipped');
          currentPage++;
        }
      });

      // ⬅ Go back a page
      prevBtn.addEventListener('click', () => {
        if (currentPage > 0) {
          currentPage--;
          pages[currentPage].classList.remove('flipped');
        }
      });
    });
  </script>
</body>
</html>
