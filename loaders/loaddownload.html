<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>loading...</title>
</head>

<style>
	body {
		height: 100vh;
		margin: 0;
		background: rgb(0, 0, 15);
		display: flex;
		justify-content: center;
		align-items: center;
		background-image: url();
		flex-direction: column;

	}

	.loader {
    width: 100px;
    height: 100px;
    box-shadow: 0 0 20px #0ff, 0 0 40px #0ff, 0 0 60px #0f0f0f;
    border: 6px solid transparent;
    border-top: 6px solid #0ff;
    border-radius: 50%;
    animation: spin 1.5s linear infinite;

    /* centers the image */
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.loader img {
    width: 90%;   /* adjust size */
    height: auto;
    pointer-events: none; /* optional: ensures no interaction */
}


	@keyframes spin {
		0% {
			transform: rotate(0deg);
			box-shadow: 0 0 20px #0ff;
		}
		50% {
			box-shadow: 0 0 40px #0ff, 0 0 60px #0ff;
		}

		100% {
			transform: rotate(260deg);
			box-shadow: 0 0 20px #0ff;
		}
	}

	.text {
		color: #0ff;
		font-family: georgia;
	}

	.box {
		width: 230px;
		height: 120px;
		display: grid;
		place-content: center;
		color: 0ff;
		font-size: 20px;
		--border-angle: 0turn;
		--main-bg: conic-gradient(
		from var(--border-angle),
		#213,
		#112 5%,
		#112 60%,
		#213 95%
		);
		--gradient-border: conic-gradient(
			from var(--border-angle),
			transparent 25%,
			#08f,
			#f03 99%,
			transpa);

		border: solid 5px transparent;
		border-radius: 2rem;
		background: 
		var(--main-bg) padding-box,
		var(--gradient-border) border-box,
		var(--main-bg) border-box;

		background-position: center center;
		animation: bg-spin 3s linear infinite;

	}

	.box:hover {
		animation-play-state: paused;
	}

	@keyframes bg-spin {
		to {
			--border-angle: 1turn;
		}
	}

	@property --border-angle {
		syntax: "<angle>";
		inherits: true;
		initial-value: 0turn;
	}

	.bd {
		background-color: rgba(red, green, blue, alpha);
	}

	button {
    width: auto;
    padding: 12px;
    background: linear-gradient(to right, yellow, green);
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-size: 16px;
    color: navy;
    font-weight: 10500;
    margin-bottom: 20px;
    transition: 0.5s;
	display: none;
}

button:hover {
    background: linear-gradient(to right, green, yellow);
}
</style>
<body>

	<!--FULL PAGE PROTECTION SCRIPT -->

<script>
	//Right-Click
	document.addEventListener('contextmenu', event => event.preventDefault());
</script>

<!--F12-->
<script>
	document.onkeydown = function(e) {

	//F12
	if (e.keyCode == 123) {
		return false;
	}


//Ctrl+Shift+I or Ctrl+Shift+J or Ctrl+Shift+C

	if (e.ctrlKey && e.shiftKey && (
		e.keyCode === 73 ||
		e.keyCode === 74 ||
		e.keyCode === 67
	)) {
		return false;
	}

//Ctrl+U View Source-->

	if (e.ctrlKey && e.keyCode === 85) {
		return false;
	}

	//Ctrl+C Copy
	if (e.ctrlKey && e.keyCode === 67) {
		return false;
	}
};
</script>

	
	<div class="loader">
		<img src="rnet.png">
	</div>
	<div class="text">
		<h3>Loading, please wait...</h3>
		<h2>Click next to proceed</h2>
	</div>

	<div class="box">
		
	</div>
	

	<button class="bd" id="button" onclick="window.location.href='../downloads.html'";>NEXT</button>

	<script>
		
			setTimeout(() => {
				document.getElementById("button").style.display = "block";
		}, 2500);

		
	</script>

</body>
</html>
