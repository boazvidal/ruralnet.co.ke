<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>glow</title>

<style>
    .stat-box{
    position: relative;
    width: 180px;
    height: 70px;
    border-radius: 20px;
    overflow: hidden;
}

/* rotating glow */
.stat-box::before{
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background: conic-gradient(
        transparent,
        transparent,
        transparent,
        #0044ff
    );
    animation: rotateBorder 4s linear infinite;
}

/* inner box */
.stat-box::after{
    content: "";
    position: absolute;
    inset: 3px;
    background: rgba(0,0,0,0.5);
    border-radius: 18px;
}

/* content above */
.stat-box .content{
    position: relative;
    z-index: 2;
    color: white;
    text-align: center;
    padding-top: 10px;
}

/* animation */
@keyframes rotateBorder{
    100%{
        transform: rotate(360deg);
    }
}

</style>
</head>
<body>
    <div class="stat-box">
    <div class="content">
        <h3>7,000</h3>
        <p>No Of Students</p>
    </div>
</div>
</body>
</html>
